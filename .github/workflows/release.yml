name: Build & Auto Release NetCinema APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android Release APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --build-name=1.0.3 --build-number=4

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: NetCinema Native Mobile App v1.0.3
          body: |
            ## NetCinema Native Mobile App v1.0.3 🎬🍿
            
            ### 🚀 Pembaruan Utama Versi 1.0.3:
            - **Resolusi 480P MP4 Direct Stream**: Pemutaran video diprioritaskan ke format MP4 H264 480P yang didukung secara native oleh semua HP Android tanpa lag/buffering.
            - **Menu Pilihan Episode & Season**: Menampilkan pilihan Season 1, 2, 3 dan daftar Episode lengkap yang dapat langsung diputar secara fleksibel.
            - **Auto-Fallback Engine**: Otomatis berpindah parameter stream jika link episode/movie offline.
            
            ### 📥 Cara Instalasi:
            1. Unduh berkas **`app-release.apk`** di bawah ini.
            2. Pasang pada perangkat Android Anda.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
