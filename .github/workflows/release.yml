name: Build & Auto Release NetCinema APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android Release APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --build-name=1.0.1 --build-number=2

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: NetCinema Native Mobile App v1.0.1
          body: |
            ## NetCinema Native Mobile App v1.0.1 🎬🍿
            
            ### 🚀 Pembaruan Utama Versi 1.0.1:
            - **Performa 60 FPS Super Mulus**: Lazy Viewport Rendering (`CustomScrollView` + `SliverList`) & optimasi memori RAM gambar >80%.
            - **Streaming Video Instan**: Pemutar video native terhubung ke backend API stream 1080P/H264.
            - **In-App Force Update Modal**: Notifikasi pembaruan otomatis langsung dari aplikasi.
            - **Auto Installer**: Menginstal APK baru tanpa menghapus data aplikasi lama.
            
            ### 📥 Cara Instalasi:
            1. Unduh berkas **`app-release.apk`** di bawah ini.
            2. Pasang pada perangkat Android Anda.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
